<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Secret Chat</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <!-- 主页频道界面 -->
  <div id="homepage" class="page">
    <div class="page-header">
      <h2>Secret Chat</h2>
      <div class="header-buttons">
        <button id="settings-btn" class="btn-secondary" title="设置昵称">昵称</button>
        <button id="join-channel-btn" class="btn-secondary">加入频道</button>
        <button id="create-channel-btn" class="btn-primary">创建频道</button>
      </div>
    </div>
    
    <!-- 所有频道列表 -->
    <div class="channels-section">
      <div class="section-header">
        <h3>所有频道</h3>
        <div class="header-actions">
          <span id="server-status" class="server-status" title="服务器连接状态">🔴</span>
          <button id="sync-data-btn" class="btn-refresh" title="同步数据" onclick="manualSync()">同步</button>
          <button id="refresh-channels-btn" class="btn-refresh" title="刷新频道列表">刷新</button>
        </div>
      </div>
      <div id="channels-list" class="channels-container">
        <!-- 频道列表将在这里动态生成 -->
      </div>
    </div>
  </div>

  <!-- 加入频道模态框 -->
  <div id="channel-modal" class="modal" style="display: none !important;">
    <div class="modal-content">
      <h2>加入</h2>
      <input id="modal-channel" placeholder="频道名" autocomplete="off">
      <input id="modal-password" placeholder="频道密码（如果有）" autocomplete="off" type="password">
      <div class="modal-buttons">
        <button id="modal-cancel" class="btn-secondary">取消</button>
        <button id="modal-join" class="btn-primary">进入</button>
      </div>
    </div>
  </div>

  <!-- 设置模态框 -->
  <div id="settings-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <h2>设置</h2>
      <div class="setting-item">
        <label for="global-nickname">全局昵称：</label>
        <input id="global-nickname" placeholder="输入您的昵称" autocomplete="off">
        <p class="setting-hint">设置后加入任何频道都会使用这个昵称</p>
      </div>
      <div class="modal-buttons">
        <button id="settings-cancel" class="btn-secondary">取消</button>
        <button id="settings-save" class="btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 创建频道模态框 -->
  <div id="create-channel-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <h2>创建频道</h2>
      <input id="create-channel-name" placeholder="频道名" autocomplete="off">
      <textarea id="create-channel-desc" placeholder="频道描述..." rows="4"></textarea>
      <input id="create-channel-password" placeholder="频道密码（可选，留空为公开频道）" autocomplete="off" type="password">
      <div class="modal-buttons">
        <button id="create-channel-cancel" class="btn-secondary">取消</button>
        <button id="create-channel-submit" class="btn-primary">创建</button>
      </div>
    </div>
  </div>


  <!-- 聊天界面 -->
  <div id="chat-page" class="page" style="display: none;">
    <div class="chat-header">
      <h3 id="current-channel">频道名</h3>
      <div class="chat-actions">
        <button id="delete-channel-btn" class="btn-danger" style="display: none;">删除频道</button>
        <button id="back-home" title="返回主页">主页</button>
      </div>
    </div>
    <div id="messages">加载中...</div>
    <div id="input-area">
      <input id="input" placeholder="输入消息...">
      <button id="image-btn" title="发送图片">图片</button>
      <button id="send">发送</button>
    </div>
  </div>


  <!-- 隐藏的文件输入 -->
  <input type="file" id="image-input" accept="image/*" style="display: none;">

  <script>
    // 立即隐藏模态框，防止显示
    document.addEventListener('DOMContentLoaded', function() {
      const modal = document.getElementById('channel-modal');
      if (modal) {
        modal.style.display = 'none';
      }
    });
  </script>
  <script src="main.js"></script>
</body>
</html>
